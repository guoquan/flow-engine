name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write # Required for Codecov comments if using tokenless or specific setups
  checks: write        # Required for test result annotations

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests with Coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./test-results/junit.xml

      - name: Verify Build
        run: pnpm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Visual Tests
        run: pnpm exec playwright test

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Push Screenshots to Previews Branch
        if: github.event_name == 'pull_request' && always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin previews || git branch previews
          git checkout previews
          mkdir -p snapshots/${{ github.event.number }}/${{ github.run_id }}
          cp test-results/*.png snapshots/${{ github.event.number }}/${{ github.run_id }}/
          git add snapshots/
          git commit -m "docs: upload e2e snapshots for PR ${{ github.event.number }} run ${{ github.run_id }}"
          git push origin previews

      - name: Comment PR with E2E Summary
        if: github.event_name == 'pull_request' && always()
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## 🎭 E2E Visual Test Report
            - **Status**: ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
            - **Full Report**: [Download Playwright Artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)
            
            ### 📸 Visual Snapshots (Instant)
            | Initial State | Looking at Target | Returned to Idle |
            | :---: | :---: | :---: |
            | ![Initial](https://raw.githubusercontent.com/${{ github.repository }}/previews/snapshots/${{ github.event.number }}/${{ github.run_id }}/initial-view.png) | ![LookAt](https://raw.githubusercontent.com/${{ github.repository }}/previews/snapshots/${{ github.event.number }}/${{ github.run_id }}/lookat-view.png) | ![Returned](https://raw.githubusercontent.com/${{ github.repository }}/previews/snapshots/${{ github.event.number }}/${{ github.run_id }}/returned-view.png)
          comment_tag: e2e-report

