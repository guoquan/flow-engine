name: E2E Visual Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Build Demo
      run: BUILD_DEMO=true GITHUB_PAGES=true OUT_DIR=dist pnpm run build

    - name: Create Screenshot Directory
      run: mkdir -p test-results/screenshots

    - name: Debug Build Output
      run: ls -R dist || echo "dist not found"

    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        CI: true

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Visual Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-screenshots
        path: test-results/screenshots/
        retention-days: 30

    # --- Push to visual-reports branch (Versioned by SHA) ---
    - name: Deploy screenshots to visual-reports branch
      if: always() && github.event_name == 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./test-results/screenshots
        publish_branch: visual-reports
        # Versioned path: <PR_NUMBER>/<COMMIT_SHA>
        destination_dir: ${{ github.event.pull_request.number || 'main' }}/${{ github.sha }}
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    # --- Visual Reporting Logic ---
    
    - name: Generate Visual Report Comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          if (!context.issue.number) return;

          const screenshotDir = 'test-results/screenshots';
          const prNumber = context.issue.number;
          const sha = context.sha;
          const repo = context.repo.repo;
          const owner = context.repo.owner;
          const baseUrl = `https://raw.githubusercontent.com/${owner}/${repo}/visual-reports/${prNumber}/${sha}`;
          const treeUrl = `https://github.com/${owner}/${repo}/tree/visual-reports/${prNumber}/${sha}`;
          
          let commentBody = `## 📸 Visual E2E Report (Commit: ${sha.substring(0, 7)})

`;
          
          // Helper to format caption
          const formatCaption = (filename) => {
            return filename.replace(/[-_]/g, ' ').replace(/\.png$/i, '').replace(/\b\w/g, c => c.toUpperCase());
          };

          try {
            if (fs.existsSync(screenshotDir)) {
              const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));
              
              if (files.length === 0) {
                commentBody += 'No screenshots captured.';
              } else {
                commentBody += `**Summary:** ${files.length} screenshots captured.
`;
                commentBody += `📂 [Browse all images in branch](${treeUrl}) | 📦 [Download Artifacts](${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId})

`;
                
                commentBody += `### Key Visuals
`;
                
                // Defined "Key" screenshots to show immediately
                const keyScreenshots = ['initial-state.png', 'debug-mode.png'];
                const displayed = [];
                const hidden = [];

                // 1. Show Key Screenshots first
                for (const file of files) {
                  const isKey = keyScreenshots.some(k => file.includes(k));
                  
                  if (isKey) {
                    const fullSizeUrl = `${baseUrl}/${file}`;
                    commentBody += `#### ${formatCaption(file)}
`;
                    commentBody += `![${formatCaption(file)}](${fullSizeUrl})

`;
                    displayed.push(file);
                  } else {
                    hidden.push(file);
                  }
                }

                // 2. List remaining screenshots
                if (hidden.length > 0) {
                  commentBody += `<details>
<summary><strong>See ${hidden.length} more screenshots...</strong></summary>

`;
                  commentBody += `| Screenshot | Status |
|---|---|
`;
                  for (const file of hidden) {
                     const fullSizeUrl = `${baseUrl}/${file}`;
                     commentBody += `| [${file}](${fullSizeUrl}) | 📦 In Artifacts |
`;
                  }
                  commentBody += `
</details>
`;
                }
              }
            } else {
              commentBody += '⚠️ Screenshot directory not found. Tests might have failed before capture.';
            }
          } catch (error) {
            console.error(error);
            commentBody += `
Error generating report: ${error.message}`;
          }
          
          // Check for existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: owner,
            repo: repo,
            issue_number: prNumber
          });
          
          const existingComment = comments.find(c => c.body.startsWith('## 📸 Visual E2E Report'));
          
          if (existingComment) {
            github.rest.issues.updateComment({
              owner: owner,
              repo: repo,
              comment_id: existingComment.id,
              body: commentBody
            });
          } else {
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: owner,
              repo: repo,
              body: commentBody
            });
          }
