name: E2E Visual Tests

on:
  pull_request:
    branches: ["main", "v*"]
  push:
    branches: ["main", "v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Determine Commit SHA
      id: sha
      run: |
        echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

    - name: Build Demo
      run: BUILD_DEMO=true OUT_DIR=dist pnpm run build

    - name: Create Screenshot Directory
      run: mkdir -p test-results/screenshots

    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        CI: true

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Visual Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-screenshots
        path: test-results/screenshots/
        retention-days: 30

    # --- Visual Reporting Logic ---

    # 1. First, try to push to visual-reports branch
    - name: Deploy screenshots to visual-reports branch
      id: deploy_screenshots
      if: always() && github.event_name == 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./test-results/screenshots
        publish_branch: visual-reports
        destination_dir: ${{ github.event.pull_request.number || 'main' }}/${{ env.COMMIT_SHA }}
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    # 2. Generate the PR comment (aware of push success/failure)
    - name: Generate Visual Report Comment
      id: generate_comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      env:
        DEPLOY_OUTCOME: ${{ steps.deploy_screenshots.outcome }}
      with:
        script: |
          const script = require('./.github/scripts/generate-visual-report.cjs');
          await script({github, context, core});

    # 3. Generate README for the branch (if push succeeded or for local reference)
    - name: Generate Report README
      if: always()
      uses: actions/github-script@v7
      env:
        COMMENT_ID: ${{ steps.generate_comment.outputs.comment_id }}
      with:
        script: |
          const script = require('./.github/scripts/generate-readme.cjs');
          await script({github, context, core});
