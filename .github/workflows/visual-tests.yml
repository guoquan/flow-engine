name: E2E Visual Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Determine Commit SHA
      id: sha
      run: |
        echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

    - name: Build Demo
      run: BUILD_DEMO=true OUT_DIR=dist pnpm run build

    - name: Create Screenshot Directory
      run: mkdir -p test-results/screenshots

    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        CI: true

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Visual Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-screenshots
        path: test-results/screenshots/
        retention-days: 30

    # --- Visual Reporting Logic ---
    
    - name: Generate Visual Report Comment
      id: generate_comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          if (!context.issue.number) return;

          const screenshotDir = 'test-results/screenshots';
          const prNumber = context.issue.number;
          const sha = process.env.COMMIT_SHA;
          const shortSha = sha.substring(0, 7);
          const repo = context.repo.repo;
          const owner = context.repo.owner;
          const baseUrl = `https://raw.githubusercontent.com/${owner}/${repo}/visual-reports/${prNumber}/${sha}`;
          const treeUrl = `https://github.com/${owner}/${repo}/tree/visual-reports/${prNumber}/${sha}`;
          
          console.log(`Generating report for PR #${prNumber}, Commit: ${shortSha}`);
          
          let commentBody = `## 📸 Visual E2E Report (Commit: ${shortSha})\n\n`;
          
          const formatCaption = (filename) => {
            return filename.replace(/[-_]/g, ' ').replace(/\.png$/i, '').replace(/\b\w/g, c => c.toUpperCase());
          };

          try {
            if (fs.existsSync(screenshotDir)) {
              const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));
              
              if (files.length === 0) {
                commentBody += 'No screenshots captured.';
              } else {
                commentBody += `**Summary:** ${files.length} screenshots captured.\n\n`;
                commentBody += `📂 [Browse all images in branch](${treeUrl}) | 📦 [Download Artifacts](${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId})\n\n`;
                
                commentBody += `### Key Visuals\n`;
                
                const keyScreenshots = ['initial-state.png', 'debug-mode.png'];
                const displayed = [];
                const hidden = [];

                for (const file of files) {
                  const isKey = keyScreenshots.some(k => file.includes(k));
                  
                  if (isKey) {
                    const fullSizeUrl = `${baseUrl}/${file}`;
                    commentBody += `#### ${formatCaption(file)}\n`;
                    commentBody += `![${formatCaption(file)}](${fullSizeUrl})\n\n`;
                    displayed.push(file);
                  } else {
                    hidden.push(file);
                  }
                }

                if (hidden.length > 0) {
                  commentBody += `<details>\n<summary><strong>See ${hidden.length} more screenshots...</strong></summary>\n\n`;
                  commentBody += `These files are available in the [visual-reports branch](${treeUrl}) and GitHub Artifacts.\n\n`;
                  commentBody += `| Screenshot | Status |\n|---|---|
`;
                  for (const file of hidden) {
                     const fullSizeUrl = `${baseUrl}/${file}`;
                     commentBody += `| [${file}](${fullSizeUrl}) | 📦 In Artifacts |\n`;
                  }
                  commentBody += `\n</details>\n`;
                }
              }
            } else {
              commentBody += '⚠️ Screenshot directory not found. Tests might have failed before capture.';
            }
          } catch (error) {
            console.error(error);
            commentBody += `\nError generating report: ${error.message}`;
          }
          
          console.log('Report Body Length:', commentBody.length);

          const { data: comments } = await github.rest.issues.listComments({
            owner: owner,
            repo: repo,
            issue_number: prNumber,
            per_page: 100
          });

          const existingComment = comments.find(comment => {
            return comment.body && comment.body.startsWith('## 📸 Visual E2E Report');
          });

          if (existingComment) {
            console.log('Updating existing comment', existingComment.id);
            await github.rest.issues.updateComment({
              owner: owner,
              repo: repo,
              comment_id: existingComment.id,
              body: commentBody
            });
            core.setOutput('comment_id', existingComment.id);
          } else {
            console.log('Creating new comment');
            const response = await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: owner,
              repo: repo,
              body: commentBody
            });
            core.setOutput('comment_id', response.data.id);
          }

    # --- Generate README for Visual Reports Branch ---
    - name: Generate Report README
      if: always()
      uses: actions/github-script@v7
      env:
        COMMENT_ID: ${{ steps.generate_comment.outputs.comment_id }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const screenshotDir = 'test-results/screenshots';
          const prNumber = context.issue.number;
          const sha = process.env.COMMIT_SHA;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const commentId = process.env.COMMENT_ID;
          
          if (!fs.existsSync(screenshotDir)) {
            console.log("Screenshot directory not found, skipping README generation.");
            return;
          }
          
          const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));
          
          let md = `# Visual E2E Report\n\n`;
          if (prNumber) {
            md += `**PR:** [#${prNumber}](https://github.com/${owner}/${repo}/pull/${prNumber})\n\n`;
          }
          if (commentId && prNumber) {
            md += `**Comment:** [View Report](https://github.com/${owner}/${repo}/pull/${prNumber}#issuecomment-${commentId})\n\n`;
          }
          md += `**Commit:** [
${sha.substring(0,7)}
](https://github.com/${owner}/${repo}/commit/${sha})

`;
          md += `**Generated:** ${new Date().toUTCString()}

`;
          
          md += `## Gallery\n\n`;
          
          if (files.length === 0) {
            md += "_No screenshots captured._\n";
          } else {
            files.sort();
            for (const file of files) {
              const caption = file.replace(/[-_]/g, ' ').replace(/\.png$/i, '');
              md += `### ${caption}\n\n`;
              md += `![${caption}](./${file})\n\n`; 
            }
          }
          
          fs.writeFileSync(path.join(screenshotDir, 'README.md'), md);
          console.log("README.md generated in screenshot directory.");

    # --- Push to visual-reports branch (Versioned by SHA) ---
    - name: Deploy screenshots to visual-reports branch
      if: always() && github.event_name == 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./test-results/screenshots
        publish_branch: visual-reports
        destination_dir: ${{ github.event.pull_request.number || 'main' }}/${{ env.COMMIT_SHA }}
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'