name: E2E Visual Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Build Demo
      run: BUILD_DEMO=true OUT_DIR=dist pnpm run build

    - name: Create Screenshot Directory
      run: mkdir -p test-results/screenshots

    - name: Debug Build Output
      run: ls -R dist || echo "dist not found"

    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        CI: true

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Visual Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-screenshots
        path: test-results/screenshots/
        retention-days: 30

    # --- Push to visual-reports branch (Versioned by SHA) ---
    - name: Deploy screenshots to visual-reports branch
      if: always() && github.event_name == 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./test-results/screenshots
        publish_branch: visual-reports
        # Versioned path: <PR_NUMBER>/<COMMIT_SHA>
        destination_dir: ${{ github.event.pull_request.number || 'main' }}/${{ github.sha }}
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    # --- Visual Reporting Logic ---
    
    - name: Generate Visual Report Comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          if (!context.issue.number) return;

          const screenshotDir = 'test-results/screenshots';
          const prNumber = context.issue.number;
          // For PRs, use the head sha, not the merge commit sha
          const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
          const shortSha = sha.substring(0, 7);
          const repo = context.repo.repo;
          const owner = context.repo.owner;
          const baseUrl = `https://raw.githubusercontent.com/${owner}/${repo}/visual-reports/${prNumber}/${sha}`;
          const treeUrl = `https://github.com/${owner}/${repo}/tree/visual-reports/${prNumber}/${sha}`;
          
          console.log(`Generating report for PR #${prNumber}, Commit: ${shortSha}`);
          
          let commentBody = `## 📸 Visual E2E Report (Commit: ${shortSha})\n\n`;
          
          // Helper to format caption
          const formatCaption = (filename) => {
            return filename.replace(/[-_]/g, ' ').replace(/\.png$/i, '').replace(/\b\w/g, c => c.toUpperCase());
          };

          try {
            if (fs.existsSync(screenshotDir)) {
              const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));
              
              if (files.length === 0) {
                commentBody += 'No screenshots captured.';
              } else {
                commentBody += `**Summary:** ${files.length} screenshots captured.\n`;
                commentBody += `📂 [Browse all images in branch](${treeUrl}) | 📦 [Download Artifacts](${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId})\n\n`;
                
                commentBody += `### Key Visuals (Embedded)\n`;
                
                // Defined "Key" screenshots to show immediately
                const keyScreenshots = ['initial-state.png', 'debug-mode.png'];
                const displayed = [];
                const hidden = [];

                // 1. Show Key Screenshots first as embedded Base64
                for (const file of files) {
                  const isKey = keyScreenshots.some(k => file.includes(k));
                  
                  if (isKey) {
                    const fullSizeUrl = `${baseUrl}/${file}`;
                    const imagePath = path.join(screenshotDir, file);
                    try {
                      const stats = fs.statSync(imagePath);
                      // Only embed if smaller than 500KB to avoid hitting comment limit
                      if (stats.size < 500000) {
                        const imageBase64 = fs.readFileSync(imagePath).toString('base64');
                        const dataUri = `data:image/png;base64,${imageBase64}`;
                        commentBody += `#### ${formatCaption(file)}\n`;
                        commentBody += `<a href="${fullSizeUrl}"><img src="${dataUri}" alt="${formatCaption(file)}" width="600"/></a>\n\n`;
                        displayed.push(file);
                      } else {
                        hidden.push(file);
                      }
                    } catch (e) {
                      console.error(`Failed to embed ${file}:`, e);
                      hidden.push(file);
                    }
                  } else {
                    hidden.push(file);
                  }
                }

                // 2. List remaining screenshots
                if (hidden.length > 0) {
                  commentBody += `<details>\n<summary><strong>See ${hidden.length} more screenshots in this commit...</strong></summary>\n\n`;
                  commentBody += `These files are available in the [visual-reports branch](${treeUrl}) and GitHub Artifacts.\n\n`;
                  commentBody += `| Screenshot | Status |\n|---|---|\n`;
                  for (const file of hidden) {
                     const fullSizeUrl = `${baseUrl}/${file}`;
                     commentBody += `| [${file}](${fullSizeUrl}) | 📦 In Artifacts |\n`;
                  }
                  commentBody += `\n</details>\n`;
                }
              }
            } else {
              commentBody += '⚠️ Screenshot directory not found. Tests might have failed before capture.';
            }
          } catch (error) {
            console.error(error);
            commentBody += `\nError generating report: ${error.message}`;
          }
          
          console.log('Report Body Length:', commentBody.length);

          // Always create a new comment for history tracking
          console.log('Creating new comment');
          await github.rest.issues.createComment({
            issue_number: prNumber,
            owner: owner,
            repo: repo,
            body: commentBody
          });
