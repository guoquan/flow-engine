name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # Need write for potentially cleaning up or handling versions
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}" # Separate concurrency per branch
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test

      - name: Calculate Deployment Path
        id: path
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # Sanitize branch name: replace non-alphanumeric with '-'
          SANITIZED_BRANCH="$(echo "$BRANCH_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')"

          if [ "$BRANCH_NAME" == "main" ]; then
            echo "base=/flow-engine/" >> $GITHUB_OUTPUT
            echo "out=dist-demo" >> $GITHUB_OUTPUT
          else
            # For track/v0.2, base becomes /flow-engine/track-v0.2/
            echo "base=/flow-engine/$SANITIZED_BRANCH/" >> $GITHUB_OUTPUT
            echo "out=dist-demo/$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Build Demo
        run: |
          mkdir -p ${{ steps.path.outputs.out }}
          GITHUB_PAGES=true VITE_BASE=${{ steps.path.outputs.base }} OUT_DIR=${{ steps.path.outputs.out }} pnpm run build:demo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # We upload the root of dist-demo for the current branch/track.
          # Note: GitHub Actions upload-pages-artifact only supports a single folder per run,
          # so each deployment overwrites the previously deployed content on the site.
          # To host multiple tracks simultaneously from one site, we'd need a more complex
          # strategy (for example, managing an orphan 'gh-pages' branch or a custom deploy job).
          path: './dist-demo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4